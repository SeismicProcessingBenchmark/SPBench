<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SeismicBench (Anonymous · ICLR 2027)</title>
    <script>
      // GitHub Pages serves this file for unknown paths (e.g. direct access
      // to /SPBench/leaderboard). Save the intended route and go to the
      // site root; index.html restores it via history.replaceState.
      (function () {
        try {
          sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
        } catch (e) {}
        location.replace('/SPBench/');
      })();
    </script>
  </head>
  <body></body>
</html>
